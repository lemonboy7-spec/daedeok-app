<div id="ddk-boot" style="position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#4F46E5;color:#fff;font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;transition:opacity .25s">
<div id="ddk-boot-t" style="font-size:28px;font-weight:900;letter-spacing:-.02em;padding:0 24px;text-align:center;word-break:keep-all">대덕부동산 정산유틸</div>
<div id="ddk-boot-s" style="margin-top:8px;font-size:13px;opacity:.75">불러오는 중…</div>
</div>
<script>(function(){try{var b=JSON.parse(localStorage.getItem('daedeokBoot_v1')||'null');if(!b)return;var e=document.getElementById('ddk-boot');if(b.bg)e.style.background=b.bg;if(b.fg)e.style.color=b.fg;if(b.title)document.getElementById('ddk-boot-t').textContent=b.title;if(b.sub)document.getElementById('ddk-boot-s').textContent=b.sub;if(b.font)e.style.fontFamily=b.font+',system-ui,sans-serif';}catch(x){}})();</script>
<div id="root"></div>
<script>window.__ddkHash0 = location.hash;</script>
<script type="module" src="js/main.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    // 예전 버전이 남아 있던 폰(다른 브라우저·오래 안 연 앱)에서 새 버전이 받아지면 한 번만 다시 열어 바로 최신으로
    var hadSW = !!navigator.serviceWorker.controller, firstHash = window.__ddkHash0 || '', reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadSW || reloaded) return; reloaded = true;
      try { if (firstHash && !location.hash) history.replaceState(null, '', location.pathname + location.search + firstHash); } catch (e) {}
      location.reload();
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (r) { try { var u = r.update(); if (u && u.catch) u.catch(function () {}); } catch (e) {} }).catch(function (e) { console.warn('SW 등록 실패', e); });
    });
  }
</script>
