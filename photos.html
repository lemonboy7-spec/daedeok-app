<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>매물 사진</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#1e293b;--sub:#64748b}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--ink:#e2e8f0;--sub:#94a3b8}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:720px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:20px;margin:4px 2px 14px}
img{display:block;width:100%;height:auto;border-radius:14px;margin:0 0 12px;background:var(--card)}
.m{color:var(--sub);font-size:14px;text-align:center;margin-top:18px}
.ld{color:var(--sub);text-align:center;padding:60px 0}
.box{background:var(--card);border-radius:14px;padding:12px 14px;margin:0 0 12px;white-space:pre-wrap;word-break:keep-all}
.g{display:grid;gap:8px;margin:0 0 12px}.g img{margin:0;cursor:zoom-in}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2 img,.g3 img{aspect-ratio:1/1;object-fit:cover;height:100%}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin:18px 0 12px;border-left:5px solid #059669}
.card b{display:block;font-size:17px}.card .s{color:var(--sub);font-size:14px}
.card a{color:inherit}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{display:inline-block;padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px;text-decoration:none}
.k{background:#fee500;color:#191600}.n{background:#03c75a;color:#fff}.t{background:#059669;color:#fff}
.map{background:var(--card);border-radius:14px;padding:12px 14px;margin:0 0 12px}.map img{margin:6px 0 8px}
#zv{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9}
#zv img{max-width:100%;max-height:100%;width:auto;border-radius:0;margin:0}
/* v7.90 테마 (링크 끝 _테마-색) */
:root{--ac:#2563eb}
body.th-portal{--bg:#fff;--card:#fff;--ink:#1a1a1a;--sub:#666;font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body.th-portal h1{font-weight:800;padding-bottom:10px;border-bottom:1px solid #e6e6e6}
body.th-portal img{border-radius:4px}body.th-portal .box,body.th-portal .card,body.th-portal .map{border:1px solid #e6e6e6;border-radius:6px}body.th-portal .card{border-left:5px solid var(--ac)}
body.th-photo{--bg:#0f172a;--card:#1e293b;--ink:#f1f5f9;--sub:#94a3b8}
.hero{position:relative;margin:0 0 12px}.hero img{margin:0;border-radius:16px}.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:48px 16px 14px;border-radius:0 0 16px 16px;background:linear-gradient(to top,rgba(0,0,0,.72),transparent);color:#fff}.hero .cap b{display:block;font-size:22px;font-weight:800;line-height:1.3;word-break:keep-all}
body.th-kakao{--bg:#fff;--card:#f5f5f5;--ink:#1a1a1a;--sub:#555}
.band{background:var(--ac);color:#fff;font-weight:800;font-size:16px;padding:14px 16px;margin:-18px -14px 14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
body.th-kakao h1{color:var(--ac);font-size:24px;font-weight:900}body.th-kakao .g{gap:6px}body.th-kakao .card{border-left-color:var(--ac)}body.th-kakao .t,body.th-portal .t{background:var(--ac)}
body.th-magazine{--bg:#111;--card:#1b1b1b;--ink:#e8dcc0;--sub:#b8ac8f;font-family:"Noto Serif KR","Nanum Myeongjo",serif}
body.th-magazine h1{font-weight:600;letter-spacing:.02em;padding-bottom:12px;border-bottom:1px solid #b39b6b;color:#f5e7b8}
body.th-magazine img{border-radius:0;padding:8px;background:#fff}body.th-magazine .g img{padding:5px}
body.th-magazine .box,body.th-magazine .map{border:1px solid #3a3326;border-radius:2px}body.th-magazine .card{border-radius:2px;border-left:3px solid #b39b6b}
body.th-magazine .t{background:#b39b6b;color:#111}
body.th-blog{--bg:#f8fafc;--card:#fff;--ink:#0f172a;--sub:#64748b}
body.th-blog h1{background:var(--ac);color:#fff;border-radius:16px;padding:18px 18px;font-size:24px;font-weight:900;word-break:keep-all;margin-left:0;margin-right:0}
body.th-blog .card{border-left-color:var(--ac)}body.th-blog .t{background:var(--ac)}
body.th-featured{--bg:#fff;--card:#f8fafc;--ink:#111827;--sub:#6b7280}
.ribbon{display:inline-block;background:var(--ac);color:#fff;font-weight:700;font-size:13px;padding:4px 10px;border-radius:6px;margin:2px 2px 0}
body.th-featured img{aspect-ratio:16/9;object-fit:cover}body.th-featured .g2 img,body.th-featured .g3 img{aspect-ratio:1/1}body.th-featured .card{border-left-color:var(--ac)}body.th-featured .t{background:var(--ac)}
</style></head><body><main id="m"><div class="ld">사진을 불러오는 중…</div></main>
<script>
(function(){
  var q = new URLSearchParams(location.search), k = q.get('k') || '', s = q.get('s') || '', m = document.getElementById('m');
  var vv = q.get('v') || ''; if (vv && vv.lastIndexOf('.') > 0) { k = vv.slice(0, vv.lastIndexOf('.')); s = vv.slice(vv.lastIndexOf('.') + 1); } // v7.30.1 ?v=서버ID.토큰 (& 없는 링크)
  var th = '', ac = ''; if (s.indexOf('_') > 0) { var tt = s.slice(s.indexOf('_') + 1); s = s.slice(0, s.indexOf('_')); var mt = /^([a-z]{3,12})(?:-([0-9a-fA-F]{6}))?$/.exec(tt); if (mt) { th = mt[1]; ac = mt[2] || ''; } } // v7.90 테마
  if (/^(portal|photo|kakao|magazine|blog|featured)$/.test(th)) { document.body.className = 'th-' + th; if (ac) document.documentElement.style.setProperty('--ac', '#' + ac); }
  var esc = function(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var msg = function(h, p){ m.innerHTML = '<h1>' + h + '</h1>' + (p ? '<p class="m">' + p + '</p>' : ''); };
  if (/^[A-Za-z0-9_-]{10,}$/.test(k) && !s) { msg('링크 끝부분이 잘렸습니다', '문자 앱이 링크를 잘라서 보냈어요. 보내 준 부동산에 다시 보내 달라고 해 주세요.'); return; }
  if (!/^[A-Za-z0-9_-]{10,}$/.test(k) || !/^[A-Z0-9]{24}$/.test(s)) { msg('링크가 맞지 않습니다'); return; }
  var url = 'https://script.google.com/macros/s/' + k + '/exec?sj=' + s;
  fetch(url).then(function(r){ return r.json(); }).then(function(d){
    if (d && d.ok && !Array.isArray(d.photos)) { location.replace('https://script.google.com/macros/s/' + k + '/exec?s=' + s); return; } // 예전 서버(v22 이하): 서버 보기 화면으로
    if (!d || !d.ok) { if (d && d.error === 'expired') msg('사진 보기 기간이 지났습니다', '보내 준 부동산에 다시 요청해 주세요.'); else if (d && d.error === 'stopped') msg('보내 준 쪽에서 링크를 닫았습니다'); else msg('링크가 맞지 않습니다'); return; }
    // v7.29.1 서버가 v23보다 예전이면 ?sj= 를 몰라서 사진 없이 {ok:true} 만 줌 → 예전 보기 화면(?s=)으로
    if (!Array.isArray(d.photos)) { location.replace('https://script.google.com/macros/s/' + k + '/exec?s=' + s); return; }
    document.title = d.title || '매물 사진';
    var L = (d.look && typeof d.look === 'object') ? d.look : {}, ok = function(p){ return /^data:image\/(jpeg|png|webp);base64,/.test(String(p || '')); };
    var C0 = (L.card && typeof L.card === 'object') ? L.card : null;
    var h = '';
    if (th === 'kakao') h += '<div class="band"><span>' + esc((C0 && (C0.company || C0.name)) || '매물 안내') + '</span>' + (C0 && C0.phone ? '<span>' + esc(C0.phone) + '</span>' : '') + '</div>';
    if (th === 'featured') h += '<span class="ribbon">추천 매물</span>';
    if (th !== 'photo') h += '<h1>' + esc(d.title || '매물 사진') + '</h1>';
    if (L.top) h += '<div class="box">' + esc(L.top) + '</div>';
    var g = L.size === 's' ? 'g g3' : L.size === 'm' ? 'g g2' : 'g', ph = (d.photos || []).filter(ok);
    if (th === 'photo') { if (ph.length) { h = '<div class="hero"><img alt="매물 사진" src="' + ph[0] + '"><div class="cap"><b>' + esc(d.title || '매물 사진') + '</b></div></div>' + h; ph = ph.slice(1); } else h = '<h1>' + esc(d.title || '매물 사진') + '</h1>' + h; }
    if (th === 'kakao' && L.size !== 's') g = 'g g2';
    if (ph.length) { h += '<div class="' + g + '">'; ph.forEach(function(p){ h += '<img alt="매물 사진" src="' + p + '">'; }); h += '</div>'; }
    else if (!(th === 'photo' && (d.photos || []).filter(ok).length)) h += '<p class="m">사진이 없습니다.</p>';
    if (L.bottom) h += '<div class="box">' + esc(L.bottom) + '</div>';
    var C = L.card;
    if (C && typeof C === 'object') {
      var tel = String(C.phone || '').replace(/[^0-9]/g, ''), ot = String(C.office || '').replace(/[^0-9]/g, '');
      h += '<div class="card">' + (C.company ? '<b>' + esc(C.company) + '</b>' : '') + ((C.name || C.title) ? '<div>' + esc([C.name, C.title].filter(Boolean).join(' · ')) + '</div>' : '')
        + (C.phone ? '<div>휴대폰 ' + esc(C.phone) + '</div>' : '') + (C.office ? '<div>사무실 ' + esc(C.office) + '</div>' : '') + (C.addr ? '<div class="s">' + esc(C.addr) + '</div>' : '') + (C.line ? '<div class="s">' + esc(C.line) + '</div>' : '')
        + ((tel || ot) ? '<div class="btns">' + (tel ? '<a class="btn t" href="tel:' + tel + '">전화하기</a><a class="btn t" href="sms:' + tel + '">문자</a>' : '<a class="btn t" href="tel:' + ot + '">전화하기</a>') + '</div>' : '') + '</div>';
    }
    var M = L.map;
    if (M && typeof M === 'object' && (M.img || M.addr)) {
      var q2 = encodeURIComponent(String(M.addr || ''));
      h += '<div class="map"><b>찾아오시는 길</b>' + (ok(M.img) ? '<img alt="약도" src="' + M.img + '">' : '') + (M.addr ? '<div class="s">' + esc(M.addr) + '</div><div class="btns"><a class="btn k" target="_blank" rel="noopener" href="https://map.kakao.com/link/search/' + q2 + '">카카오맵</a><a class="btn n" target="_blank" rel="noopener" href="https://map.naver.com/p/search/' + q2 + '">네이버 지도</a></div>' : '') + '</div>';
    }
    h += '<p class="m">' + esc(d.until || '') + '까지 볼 수 있어요.</p>';
    m.innerHTML = h;
    if (L.size === 's' || L.size === 'm') {
      var zv = document.createElement('div'); zv.id = 'zv'; zv.innerHTML = '<img alt="크게 보기">'; document.body.appendChild(zv);
      zv.onclick = function(){ zv.style.display = 'none'; };
      Array.prototype.forEach.call(m.querySelectorAll('.g img, .hero img'), function(im){ im.onclick = function(){ zv.firstChild.src = im.src; zv.style.display = 'flex'; }; });
    }
  }).catch(function(){ location.replace('https://script.google.com/macros/s/' + k + '/exec?s=' + s); });
})();
</script></body></html>
